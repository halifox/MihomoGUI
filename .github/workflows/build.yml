name: Build macOS arm64
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (empty means build only)
        required: false
        type: string
      signed_release:
        description: Sign with Developer ID and notarize (requires configured secrets)
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      signed_release:
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: build-${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      SIGNED_BUILD: ${{ github.event_name != 'pull_request' && (inputs.signed_release || ((inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')) && vars.ENABLE_SIGNED_RELEASES == 'true')) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Verify build toolchain
        run: |
          xcodebuild -version
          swiftc --version
          xcrun --sdk macosx --show-sdk-version
          test "$(xcrun --sdk macosx --show-sdk-version)" = "26.5"
      - name: Check architecture and release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          test "$(uname -m)" = arm64
          if [ -n "$RELEASE_TAG" ]; then
            test "$RELEASE_TAG" = "v$(cat VERSION)"
          fi
      - name: Check release failure paths
        run: python3 scripts/check-release.py
      - name: Check field source provenance
        run: python3 scripts/check-field-sources.py
      - name: Check resource identity gates
        run: python3 scripts/check-resources.py
      - name: Download bundled resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/resources.py download
      - name: Prepare signing credentials
        if: env.SIGNED_BUILD == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          CERTIFICATE_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CERTIFICATE"
          [[ "$CERTIFICATE_IDENTITY" =~ ^[[:xdigit:]]{40}$ ]]
          test -n "$NOTARY_KEY" && test -n "$NOTARY_KEY_ID" && test -n "$NOTARY_ISSUER"
          signing_keychain="$RUNNER_TEMP/MihomoGUI-signing.keychain-db"
          signing_password="$(openssl rand -base64 32)"
          printf '%s' "$CERTIFICATE" | /usr/bin/base64 -D > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$signing_keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$signing_password" "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain"
          xcrun notarytool store-credentials MihomoGUI-CI --key "$RUNNER_TEMP/notary-key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --keychain "$signing_keychain"
          printf 'SIGNING_IDENTITY=%s\nNOTARY_PROFILE=MihomoGUI-CI\nNOTARY_KEYCHAIN=%s\n' "$CERTIFICATE_IDENTITY" "$signing_keychain" >> "$GITHUB_ENV"
      - name: Build application
        run: bash scripts/build.sh
      - name: Run interaction checks
        run: bash scripts/check-interactions.sh
      - name: Run runtime recovery failure checks
        run: bash scripts/check-runtime-recovery.sh
      - name: Notarize validated application
        if: env.SIGNED_BUILD == 'true'
        run: bash scripts/notarize.sh
      - name: Verify and archive application
        run: |
          codesign --verify --deep --strict dist/MihomoGUI.app
          xcrun vtool -show-build dist/MihomoGUI.app/Contents/MacOS/MihomoGUI
          test "$(xcrun vtool -show-build dist/MihomoGUI.app/Contents/MacOS/MihomoGUI | awk '$1 == "sdk" {print $2}')" = "26.5"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' dist/MihomoGUI.app/Contents/Info.plist)" = "$(cat VERSION)"
          bash scripts/archive.sh
      - name: Remove temporary signing credentials
        if: always() && env.SIGNED_BUILD == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/MihomoGUI-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary-key.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MihomoGUI-macos-arm64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
  provenance:
    needs: build
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MihomoGUI-macos-arm64
          path: release
      - name: Verify release checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: |
            release/*.zip
            release/BUILD-METADATA.json
          create-storage-record: false
      - name: Collect provenance bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" provenance.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MihomoGUI-provenance
          path: provenance.sigstore.json
          if-no-files-found: error
          retention-days: 7
  upload:
    needs: [build, provenance]
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MihomoGUI-macos-arm64
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MihomoGUI-provenance
          path: release
      - name: Upload release archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          tag = os.environ['RELEASE_TAG']
          repository = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Invalid release tag')
          folder = Path('release')
          archive = f'MihomoGUI-{tag}-macos-arm64.zip'
          required = {archive, 'BUILD-METADATA.json', 'SHA256SUMS', 'provenance.sigstore.json'}
          files = sorted(folder.iterdir())
          if {path.name for path in files} != required or not all(path.is_file() for path in files):
              raise SystemExit('Release artifact set is incomplete or contains unexpected files')

          def digest(path):
              result = hashlib.sha256()
              with path.open('rb') as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b''):
                      result.update(chunk)
              return result.hexdigest()

          checksums = {}
          for line in (folder / 'SHA256SUMS').read_text().splitlines():
              match = re.fullmatch(r'([0-9a-f]{64})  (.+)', line)
              if not match or match[2] in checksums:
                  raise SystemExit('Invalid release checksum file')
              checksums[match[2]] = match[1]
          if set(checksums) != {archive, 'BUILD-METADATA.json'}:
              raise SystemExit('Release checksum subjects do not match expected artifacts')
          for name, expected in checksums.items():
              if digest(folder / name) != expected:
                  raise SystemExit('Release checksum mismatch: ' + name)
          for name in [archive, 'BUILD-METADATA.json']:
              subprocess.run(['gh', 'attestation', 'verify', str(folder / name), '--repo', repository,
                              '--bundle', str(folder / 'provenance.sigstore.json')], check=True)
          metadata = json.loads((folder / 'BUILD-METADATA.json').read_text())
          if not re.fullmatch(r'(?:[0-9a-f]{40}|[0-9a-f]{64})', metadata.get('source_commit', '')) or metadata.get('version') != tag[1:] or metadata.get('architecture') != 'arm64':
              raise SystemExit('Invalid release build metadata')
          remote_commit = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/commits/{tag}'], text=True))
          if remote_commit.get('sha') != metadata.get('source_commit'):
              raise SystemExit('Release tag no longer identifies the built source commit')

          def release_state():
              # Listing includes drafts for push-authorized callers; the tag endpoint is published-only.
              response = subprocess.run(['gh', 'api', '--paginate', '--slurp', f'repos/{repository}/releases?per_page=100'],
                                        capture_output=True, text=True)
              if response.returncode != 0:
                  raise SystemExit('Cannot inspect releases; refusing creation after a transport or authorization error')
              pages = json.loads(response.stdout)
              if not isinstance(pages, list) or not all(isinstance(page, list) for page in pages):
                  raise SystemExit('Invalid release listing')
              matches = []
              for page in pages:
                  for state in page:
                      if not isinstance(state.get('tag_name'), str) or not isinstance(state.get('draft'), bool) or not isinstance(state.get('assets'), list):
                          raise SystemExit('Invalid release state')
                      if state['tag_name'] == tag:
                          matches.append(state)
              if len(matches) > 1:
                  raise SystemExit('Multiple releases identify the same tag; refusing publication')
              return matches[0] if matches else None

          state = release_state()
          if state is None:
              subprocess.run(['gh', 'release', 'create', tag, '--draft', '--verify-tag', '--generate-notes', '--repo', repository], check=True)
              state = release_state()
          if state is None or not state['draft']:
              raise SystemExit('Published releases are immutable; use a new version')
          collisions = required.intersection(asset['name'] for asset in state['assets'])
          if collisions:
              raise SystemExit('Release assets are immutable; conflicts: ' + ', '.join(sorted(collisions)))
          release_id = state['id']
          subprocess.run(['gh', 'release', 'upload', tag, *map(str, files), '--repo', repository], check=True)
          uploaded = release_state()
          if uploaded is None or uploaded['id'] != release_id or not uploaded['draft']:
              raise SystemExit('Release state changed during upload')
          assets = {asset['name']: asset for asset in uploaded['assets']}
          for path in files:
              asset = assets.get(path.name, {})
              if asset.get('state') != 'uploaded' or asset.get('digest') != 'sha256:' + digest(path):
                  raise SystemExit('Remote release asset missing, unfinished or mismatched: ' + path.name)
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--verify-tag', '--repo', repository], check=True)
          PYTHON
