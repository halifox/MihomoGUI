name: Update bundled resources
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-resources
  cancel-in-progress: false
jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Check upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/resources.py update
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        id: pr
        with:
          branch: automation/update-resources
          commit-message: 'fix(deps): update bundled mihomo and GEO resources'
          title: 'fix(deps): update bundled mihomo and GEO resources'
          body: |
            Updates pinned upstream resource assets and SHA-256 digests.
            Review mihomo compatibility and upstream resource licensing before merging.
          add-paths: resources/manifest.json
      - name: Validate resource update branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref automation/update-resources
